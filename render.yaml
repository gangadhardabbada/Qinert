version: "1"

services:
  - type: web
    name: quber-backend
    plan: free
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: QISKIT_IBM_TOKEN
        sync: false

  - type: web
    name: quber-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "18.18.0"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: quber-backend
          property: host
